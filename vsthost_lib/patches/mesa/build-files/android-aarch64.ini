# Meson cross-file: Mesa zink-only for Android Bionic arm64 (NDK r26, API 28).
# Standalone libEGL.so (no glvnd) over Vulkan(zink)->Turnip, for wine win32u.
# The Android NDK bin directory must be on PATH before invoking Meson.
[binaries]
c = 'aarch64-linux-android28-clang'
cpp = 'aarch64-linux-android28-clang++'
ar = 'llvm-ar'
strip = 'llvm-strip'
c_ld = 'lld'
cpp_ld = 'lld'
pkg-config = ['env', 'PKG_CONFIG_SYSROOT_DIR=@DIRNAME@/.android-deps', 'PKG_CONFIG_LIBDIR=@DIRNAME@/.android-deps/data/data/com.termux/files/usr/lib/pkgconfig', 'pkg-config']

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[properties]
needs_exe_wrapper = true

[built-in options]
c_args = ['-I@DIRNAME@/.android-deps/include']
cpp_args = ['-I@DIRNAME@/.android-deps/include']
c_link_args = ['-static-libstdc++']
cpp_link_args = ['-static-libstdc++']
